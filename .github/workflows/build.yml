name: Build & Upload

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  # A manual run on a branch builds both platforms as a check and publishes nothing;
  # only a version tag publishes :latest and :<tag>.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Builds each platform on a native runner of its own, arm64 without QEMU, and merges
  # both into one manifest under every tag below.
  build:
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write # signs the provenance attestation
    with:
      output: image
      push: ${{ github.ref_type == 'tag' }}
      platforms: linux/amd64,linux/arm64
      meta-images: |
        ghcr.io/senergy-platform/blebox-dc
      meta-tags: |
        type=raw,value=latest
        type=raw,value=${{ github.ref_name }}
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
